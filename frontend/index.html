<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/flakeguard.svg" />
    <meta name="theme-color" content="#08090C" />
    <meta name="description" content="Find the tests you can’t trust. AI-driven flaky test detection, evidence-backed remediation, and quarantine auditing with FlakeGuard." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlakeGuard — Trust your tests.</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
