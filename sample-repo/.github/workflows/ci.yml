name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      
      - name: Run tests
        run: |
          cd sample-repo
          pytest tests/ -v --tb=short
        env:
          CI: true
      
      - name: Run flaky detection
        if: always()
        run: |
          echo "Flaky test detection would run here"
          # In real implementation, this would call FlakeGuard
